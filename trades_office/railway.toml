# Railway service config for the TradeDesk AI app.
# In Railway: New service -> GitHub repo -> Settings -> Root Directory = trades_office
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
