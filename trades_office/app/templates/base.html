<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ company() }}{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb;
          --accent:#0f766e; --warn:#b45309; --bad:#b91c1c; --ok:#15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f26; --text:#e5e7eb; --muted:#9ca3af; --line:#2b323c;
            --accent:#2dd4bf; --warn:#f59e0b; --bad:#f87171; --ok:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:16px; align-items:center; }
  header a { color:var(--text); text-decoration:none; font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  a { color:var(--accent); }
  h1 { font-size:22px; margin:4px 0 16px; } h2 { font-size:17px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:24px; } .stat span { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .pill.active,.pill.booked,.pill.sent,.pill.won { color:var(--ok); border-color:currentColor; }
  .pill.trial,.pill.pending,.pill.open,.pill.message_taken { color:var(--warn); border-color:currentColor; }
  .pill.cancelled,.pill.paused,.pill.lost,.pill.urgent,.pill.transferred { color:var(--bad); border-color:currentColor; }
  .muted { color:var(--muted); }
  form.inline { display:inline; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:70px; }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:4px 10px; }
  .row { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); }
  .hours td { padding:4px; } .hours input { width:auto; }
</style>
</head>
<body>
<header><a href="/admin/">{{ company() }}</a><a href="/admin/shops/new" style="font-weight:400">+ New shop</a></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
