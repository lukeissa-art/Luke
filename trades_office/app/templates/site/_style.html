<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --paper: #f3f5f8; --surface: #ffffff; --ink: #111c2e; --muted: #56647a; --line: #d8dee7;
    --hi: #ffd23f; --on-hi: #111c2e; --pipe: #1f5e99; --alert: #c0361c; --ok: #1d7a46;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --wrap: 1120px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0c131f; --surface: #142033; --ink: #e7edf5; --muted: #97a5b8; --line: #26344a;
      --pipe: #86b9ea; --alert: #ff7c5e; --ok: #5fd08f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0c131f; --surface: #142033; --ink: #e7edf5; --muted: #97a5b8; --line: #26344a;
    --pipe: #86b9ea; --alert: #ff7c5e; --ok: #5fd08f;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--body); padding-inline: 16px; }
  .wrap { max-width: var(--wrap); margin-inline: auto; }
  a { color: var(--pipe); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid var(--pipe); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); line-height: 1.02; letter-spacing: 0.005em; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(44px, 7vw, 84px); font-weight: 900; text-transform: uppercase; }
  h2 { font-size: clamp(34px, 4.6vw, 54px); font-weight: 800; text-transform: uppercase; }
  h3 { font-size: 26px; font-weight: 800; text-transform: uppercase; }
  p { margin: 0; }
  .lede { font-size: 20px; color: var(--muted); max-width: 34em; }
  .eyebrow { font: 500 13px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  mark { background: linear-gradient(transparent 12%, var(--hi) 12%, var(--hi) 88%, transparent 88%); color: var(--on-hi); padding-inline: 0.12em; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font: 700 17px/1 var(--body); padding: 16px 22px; border-radius: 4px;
         text-decoration: none; border: 2px solid var(--ink); cursor: pointer; }
  .btn-hi { background: var(--hi); color: var(--on-hi); border-color: var(--on-hi); box-shadow: 4px 4px 0 var(--ink); }
  .btn-hi:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--surface); }
  /* site header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
  .brand { font: 900 26px/1 var(--display); text-transform: uppercase; color: var(--ink); text-decoration: none; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 14px; height: 14px; background: var(--hi); border: 2px solid var(--ink); display: inline-block; transform: rotate(45deg); }
  .top nav { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; font-weight: 600; font-size: 15px; }
  .top nav a { color: var(--ink); text-decoration: none; }
  .top nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .top nav .btn { padding: 10px 14px; font-size: 15px; }
  footer.site { border-top: 2px solid var(--ink); margin-top: 96px; padding-block: 28px 40px; display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between; color: var(--muted); font-size: 14px; }
  footer.site nav { display: flex; gap: 18px; flex-wrap: wrap; }
  footer.site a { color: var(--muted); }
  .prose { max-width: 42em; display: grid; gap: 16px; padding-block: 48px; }
  .prose h1 { font-size: clamp(40px, 6vw, 64px); }
  .prose h2 { font-size: 28px; margin-top: 16px; }
  .prose ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
</style>
